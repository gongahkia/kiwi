apiVersion: v1
kind: Service
metadata:
  name: {{ include "wat.fullname" . }}-web
  labels:
    {{- include "wat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
  selector:
    {{- include "wat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wat.fullname" . }}-web
  labels:
    {{- include "wat.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "wat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "wat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.postgresSecretName" . }}
                  key: {{ .Values.postgres.secretKeys.databaseUrl }}
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.authSecret }}
            - name: AUTH_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.authTokenEncryptionKey }}
                  optional: true
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.emailFrom }}
                  optional: true
            - name: EMAIL_SERVER
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.emailServer }}
                  optional: true
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.googleClientId }}
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.googleClientSecret }}
                  optional: true
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.slackClientId }}
                  optional: true
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.authSecretName" . }}
                  key: {{ .Values.auth.secretKeys.slackClientSecret }}
                  optional: true
            {{- range $name, $value := .Values.web.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
