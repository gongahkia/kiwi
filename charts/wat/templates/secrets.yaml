{{- if not .Values.postgres.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wat.postgresSecretName" . }}
  labels:
    {{- include "wat.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.postgres.secretKeys.password }}: {{ .Values.postgres.password | b64enc | quote }}
  {{ .Values.postgres.secretKeys.databaseUrl }}: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.user .Values.postgres.password (include "wat.fullname" .) .Values.postgres.database | b64enc | quote }}
---
{{- end }}
{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wat.authSecretName" . }}
  labels:
    {{- include "wat.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.secretKeys.authSecret }}: {{ .Values.auth.authSecret | b64enc | quote }}
  {{ .Values.auth.secretKeys.authTokenEncryptionKey }}: {{ .Values.auth.authTokenEncryptionKey | b64enc | quote }}
  {{ .Values.auth.secretKeys.emailFrom }}: {{ .Values.auth.emailFrom | b64enc | quote }}
  {{ .Values.auth.secretKeys.emailServer }}: {{ .Values.auth.emailServer | b64enc | quote }}
  {{ .Values.auth.secretKeys.googleClientId }}: {{ .Values.auth.googleClientId | b64enc | quote }}
  {{ .Values.auth.secretKeys.googleClientSecret }}: {{ .Values.auth.googleClientSecret | b64enc | quote }}
  {{ .Values.auth.secretKeys.slackClientId }}: {{ .Values.auth.slackClientId | b64enc | quote }}
  {{ .Values.auth.secretKeys.slackClientSecret }}: {{ .Values.auth.slackClientSecret | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wat.fullname" . }}-slack
  labels:
    {{- include "wat.labels" . | nindent 4 }}
type: Opaque
data:
  app-token: {{ .Values.slack.appToken | b64enc | quote }}
  bot-token: {{ .Values.slack.botToken | b64enc | quote }}
  signing-secret: {{ .Values.slack.signingSecret | b64enc | quote }}
  client-id: {{ .Values.slack.clientId | b64enc | quote }}
  client-secret: {{ .Values.slack.clientSecret | b64enc | quote }}
  state-secret: {{ .Values.slack.stateSecret | b64enc | quote }}
  token-encryption-key: {{ .Values.slack.tokenEncryptionKey | b64enc | quote }}
  metrics-token: {{ .Values.slack.metricsToken | b64enc | quote }}
  wat-api-key: {{ .Values.slack.watApiKey | b64enc | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wat.fullname" . }}-discord
  labels:
    {{- include "wat.labels" . | nindent 4 }}
type: Opaque
data:
  public-key: {{ .Values.discord.publicKey | b64enc | quote }}
  application-id: {{ .Values.discord.applicationId | b64enc | quote }}
  bot-token: {{ .Values.discord.botToken | b64enc | quote }}
  metrics-token: {{ .Values.discord.metricsToken | b64enc | quote }}
  wat-api-key: {{ .Values.discord.watApiKey | b64enc | quote }}
