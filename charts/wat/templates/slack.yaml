apiVersion: v1
kind: Service
metadata:
  name: {{ include "wat.fullname" . }}-slack
  labels:
    {{- include "wat.labels" . | nindent 4 }}
spec:
  type: {{ .Values.slack.service.type }}
  ports:
    - name: http
      port: {{ .Values.slack.service.port }}
      targetPort: http
  selector:
    {{- include "wat.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: slack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wat.fullname" . }}-slack
  labels:
    {{- include "wat.labels" . | nindent 4 }}
    app.kubernetes.io/component: slack
spec:
  replicas: {{ .Values.slack.replicaCount }}
  selector:
    matchLabels:
      {{- include "wat.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: slack
  template:
    metadata:
      labels:
        {{- include "wat.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: slack
    spec:
      containers:
        - name: slack
          image: "{{ .Values.slack.image.repository }}:{{ .Values.slack.image.tag }}"
          imagePullPolicy: {{ .Values.slack.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: SLACK_APP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: app-token
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: bot-token
            - name: SLACK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: client-id
            - name: SLACK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: client-secret
            - name: SLACK_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: signing-secret
            - name: SLACK_STATE_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: state-secret
            - name: SLACK_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: token-encryption-key
            - name: SLACK_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: metrics-token
            - name: WAT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.fullname" . }}-slack
                  key: wat-api-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.postgresSecretName" . }}
                  key: {{ .Values.postgres.secretKeys.databaseUrl }}
            - name: SLACK_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wat.postgresSecretName" . }}
                  key: {{ .Values.postgres.secretKeys.databaseUrl }}
            - name: SLACK_REDIRECT_URI
              value: {{ .Values.slack.redirectUri | quote }}
            - name: SLACK_INSTALL_STORE
              value: {{ .Values.slack.installStore | quote }}
            - name: SLACK_HTTP_MODE
              value: {{ .Values.slack.httpMode | quote }}
            - name: SLACK_SOCKET_MODE
              value: {{ .Values.slack.socketMode | quote }}
            - name: WAT_API_BASE_URL
              value: "http://{{ include "wat.fullname" . }}-web:{{ .Values.web.service.port }}"
            - name: WAT_SLACK_TEAM_MAP
              value: {{ .Values.slack.teamMap | quote }}
            - name: WAT_TEAM_ID
              value: {{ .Values.slack.teamId | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
