name: Corpus Refresh

on:
  workflow_dispatch:
    inputs:
      source:
        description: Scraper source name, or all
        required: false
        default: all
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sources:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.sources.outputs.sources }}
    steps:
      - id: sources
        env:
          REQUESTED_SOURCE: ${{ github.event.inputs.source || 'all' }}
        run: |
          all='["aws-services","azure-services","cncf-glossary","d-edge-foss-acronyms","gcp-services","ietf-rfc-index","jargon-file","kubernetes-glossary","linux-foundation-glossary","mdn-glossary","nist-csrc-glossary","postgresql-glossary","w3c-glossary","wikipedia-acronyms"]'
          if [ "$REQUESTED_SOURCE" = "all" ] || [ -z "$REQUESTED_SOURCE" ]; then
            echo "sources=$all" >> "$GITHUB_OUTPUT"
          else
            node -e 'const source = process.env.REQUESTED_SOURCE; console.log(`sources=${JSON.stringify([source])}`)' >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.sources.outputs.sources) }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: vars
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "source=${{ matrix.source }}" >> "$GITHUB_OUTPUT"
      - id: ingest
        run: |
          delta_path=$(pnpm --filter @wat/ingest ingest run "${{ steps.vars.outputs.source }}" | tail -n 1)
          echo "delta_path=$delta_path" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @wat/ingest ingest lint
      - run: pnpm --filter @wat/search test
      - run: pnpm --filter @wat/ingest summarize:delta "${{ steps.ingest.outputs.delta_path }}" reports/corpus-refresh-pr.md
      - uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/deltas/**
          branch: corpus/refresh-${{ steps.vars.outputs.source }}-${{ steps.vars.outputs.date }}
          body-path: reports/corpus-refresh-pr.md
          commit-message: "corpus: refresh ${{ steps.vars.outputs.source }} ${{ steps.vars.outputs.date }}"
          delete-branch: true
          labels: corpus, automated
          title: "corpus: refresh ${{ steps.vars.outputs.source }} ${{ steps.vars.outputs.date }}"
