name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CONTOURTTY_PACKAGE_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake dpkg-dev file pkg-config ffmpeg \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libfreetype-dev zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ffmpeg freetype glslang spirv-cross zlib

      - name: Package
        run: scripts/package_release.sh

      - name: Install Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./contourtty-*.deb
          contourtty --version

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: contourtty-*
          body: |
            contourtty release packages are dynamically linked against system FFmpeg, FreeType, and zlib.
            Install those runtime libraries with the platform package manager before using `.tar.gz` artifacts; the Linux `.deb` declares shared-library dependencies through CPack shlibdeps.
            Static-FFmpeg bundles are not shipped until the build records FFmpeg configure flags and the resulting LGPL/GPL obligations.
