name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: verify release tag
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl unzip pkg-config luajit ncurses-bin \
            libgif-dev libglib2.0-dev libglfw3-dev libfreetype-dev libharfbuzz-dev libfontconfig1-dev libpng-dev
      - name: verify and package
        run: make check && make libkiwi-vt-check && make release-check && make release && make libkiwi-vt
      - name: upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-linux
          path: dist/**
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: verify release tag
        run: |
          test "$(uname -m)" = arm64
          test "$GITHUB_REF_NAME" = "v$(tr -d '\n' < VERSION)"
      - name: install build dependencies
        run: brew install luajit glfw freetype harfbuzz fontconfig giflib libpng pkgconf ncurses
      - name: verify and package
        run: make check && make cocoa-smoke && make libkiwi-vt-check && make release-check && make release && make libkiwi-vt
      - name: upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-macos
          path: dist/**
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes --title "Kiwi $GITHUB_REF_NAME"
