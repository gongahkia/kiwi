name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check (Apple Silicon)
    runs-on: macos-15
    env:
      KIWI_REQUIRE_SHELLS: bash,zsh,fish,nu
      KIWI_INTERACTIVE_APPS: bash,zsh,fish,nu,vim,nvim,tmux,tmux-nvim,less,top,workflow,tmux-workflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: install build dependencies
        run: brew install luajit glfw freetype harfbuzz fontconfig giflib libpng pkgconf ncurses fish nushell tmux neovim
      - name: deterministic checks
        run: make check test-applications test-ssh-applications && make cocoa-smoke && make interaction-smoke pty-wake-smoke underline-framebuffer-smoke configuration-reload-smoke appearance-smoke search-smoke vi-smoke selection-smoke hints-smoke hints-framebuffer-smoke color-glyph-smoke
      - name: exercise acknowledged input while output is saturated
        run: |
          ./script/bench-interactive --trials 1 --samples 4 --warmup 1 --report .build/interactive-evidence/timing.json
          ./script/bench-interactive --mode saturated --traffic styled-unicode --trials 1 --samples 4 --warmup 1 --report .build/interactive-evidence/timing-unicode.json
          ./script/bench-interactive --keep-visible --mode saturated --traffic styled-unicode --trials 1 --samples 20 --warmup 5 --soak-seconds 60 --report .build/interactive-evidence/soak.json
      - name: upload interactive application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-macos-arm64-interactive-applications
          path: |
            .build/application-evidence
            .build/ssh-application-evidence
            .build/interactive-evidence
          include-hidden-files: true
          if-no-files-found: warn

  intel-compatibility:
    name: daily-driver compatibility (Intel)
    runs-on: macos-15-intel
    env:
      KIWI_REQUIRE_SHELLS: bash,zsh,fish,nu
      KIWI_INTERACTIVE_APPS: bash,zsh,fish,nu,vim,nvim,tmux,tmux-nvim,less,top,workflow,tmux-workflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: install compatibility dependencies
        run: brew install luajit glfw freetype harfbuzz fontconfig giflib libpng pkgconf ncurses tmux neovim fish nushell
      - name: collect bounded Intel compatibility evidence
        run: |
          mkdir -p artifacts
          make check test-applications test-ssh-applications
          make cocoa-smoke
          make interaction-smoke pty-wake-smoke underline-framebuffer-smoke configuration-reload-smoke appearance-smoke search-smoke vi-smoke selection-smoke hints-smoke hints-framebuffer-smoke color-glyph-smoke
          make daily-driver-compatibility COMPAT_ARGS='--require-desktop --report artifacts/macos-intel-compatibility.json'
      - name: exercise acknowledged input while output is saturated
        run: |
          ./script/bench-interactive --trials 1 --samples 4 --warmup 1 --report .build/interactive-evidence/timing.json
          ./script/bench-interactive --mode saturated --traffic styled-unicode --trials 1 --samples 4 --warmup 1 --report .build/interactive-evidence/timing-unicode.json
          ./script/bench-interactive --keep-visible --mode saturated --traffic styled-unicode --trials 1 --samples 20 --warmup 5 --soak-seconds 60 --report .build/interactive-evidence/soak.json
      - name: upload compatibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-macos-intel-compatibility
          path: |
            artifacts/macos-intel-compatibility.json
            .build/application-evidence
            .build/ssh-application-evidence
            .build/interactive-evidence
          include-hidden-files: true
          if-no-files-found: warn

  artifact:
    name: release artifact (Apple Silicon)
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: install packaging dependencies
        run: brew install luajit glfw freetype harfbuzz fontconfig giflib libpng pkgconf ncurses
      - name: build reproducible release-mode artifact
        run: make release-check && make release
      - name: upload artifact and checksum metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-macos-arm64
          path: dist/**
          if-no-files-found: error
