name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "book.toml"
      - "docs/book/**"
      - "packages/kumeyuri/**"
      - "tests/fuzz/official-mermaid/**"
      - "scripts/verify-site.mjs"
      - "scripts/check-mermaid-parity.mjs"
      - "scripts/check-animation-quality.mjs"
      - "scripts/check-release-trust.mjs"
      - "package.json"
      - ".github/workflows/site.yml"
  push:
    branches:
      - main
    paths:
      - "site/**"
      - "book.toml"
      - "docs/book/**"
      - "packages/kumeyuri/**"
      - "tests/fuzz/official-mermaid/**"
      - "scripts/verify-site.mjs"
      - "scripts/check-mermaid-parity.mjs"
      - "scripts/check-animation-quality.mjs"
      - "scripts/check-release-trust.mjs"
      - "package.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify static site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3

      - name: Verify site
        run: npm run site:verify

      - name: Build docs under landing site
        run: |
          npm run docs:build
          mkdir -p site/docs
          cp -R target/mdbook/. site/docs/

      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
