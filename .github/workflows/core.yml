name: Core checks

on:
  pull_request:
  push:

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install luajit
          else
            sudo apt-get update
            sudo apt-get install --yes luajit
          fi
      - name: Install Stylua
        run: cargo install stylua --version 2.5.2 --locked
      - name: Check
        run: make check
