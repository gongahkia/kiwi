name: Docs

on:
  pull_request:
    paths:
      - "book.toml"
      - "docs/book/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "book.toml"
      - "docs/book/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install mdBook
        run: cargo install mdbook --locked --version 0.5.3

      - name: Build docs and Pagefind index
        run: npm run docs:pagefind
