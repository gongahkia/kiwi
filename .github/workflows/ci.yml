name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ffmpeg

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Smoke test
        run: |
          ./build/ci/contourtty --version
          ./build/ci/contourtty --help >/dev/null

  sanitize:
    name: asan-ubsan (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev zlib1g-dev

      - name: Configure
        run: cmake --preset asan-ubsan

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        run: ctest --test-dir build/asan-ubsan --output-on-failure

      - name: Decode/render smoke
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=64x48:rate=5:duration=1 -pix_fmt yuv420p /tmp/contourtty-sanitize.mp4
          ./build/asan-ubsan/contourtty --width 16 --height 8 --dump-frame 1 --dump-png /tmp/contourtty-sanitize.png /tmp/contourtty-sanitize.mp4 >/tmp/contourtty-sanitize.probe

      - name: Shutdown path smoke
        run: scripts/verify_shutdown_paths.sh ./build/asan-ubsan/contourtty

  valgrind:
    name: valgrind (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config valgrind \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev zlib1g-dev

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --target contourtty

      - name: Normal export leak check
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=64x48:rate=5:duration=1 -pix_fmt yuv420p /tmp/contourtty-valgrind.mp4
          valgrind --leak-check=full --show-leak-kinds=definite --errors-for-leak-kinds=definite --error-exitcode=99 \
            ./build/ci/contourtty --mode structure --width 16 --height 8 --export /tmp/contourtty-valgrind.ansi --log /tmp/contourtty-valgrind.log /tmp/contourtty-valgrind.mp4
