name: Linux CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: headless core and PTY scheduler
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install minimal test dependencies
        run: sudo apt-get update && sudo apt-get install --yes luajit build-essential python3
      - name: test without native graphics libraries
        run: make test-core test-regex-oracle test-interactive-bench
      - name: check readiness watcher memory and concurrency
        run: |
          CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' make test-pty-watch test-child-watch
          CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' make test-file-watch
          CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' make test-process-metrics
          CFLAGS='-fsanitize=thread -fno-omit-frame-pointer' make test-pty-watch

  check:
    name: check
    runs-on: ubuntu-24.04
    env:
      KIWI_REQUIRE_SHELLS: bash,zsh,fish
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl unzip pkg-config luajit ncurses-bin zsh fish tmux neovim vim less procps python3 openssh-server at-spi2-core dbus-daemon fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji \
            libwayland-dev libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgif-dev libglib2.0-dev libglfw3-dev libfreetype-dev libharfbuzz-dev libfontconfig1-dev libpng-dev libgtk-4-dev libadwaita-1-dev libepoxy-dev
          sudo apt-get install --yes xvfb xauth mesa-vulkan-drivers libvulkan1
          sudo install -d -m 0755 /run/sshd
      - name: build required GLFW with X11 and Wayland
        run: |
          ./script/build-ci-glfw "$RUNNER_TEMP/kiwi-glfw"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/kiwi-glfw" "$RUNNER_TEMP/kiwi-glfw" >> "$GITHUB_ENV"
      - name: deterministic checks
        run: make check test-applications test-ssh-applications && make gtk-host-check
      - name: bound X11 primary selection transfers
        run: CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' make test-primary-selection test-main-context-watch
      - name: verify shader output and reloads with software Vulkan
        shell: bash
        run: |
          mkdir -p .build/appearance-evidence
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/kiwi-vulkan-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          for kiwi_lavapipe_icd in /usr/share/vulkan/icd.d/lvp_icd*.json; do
            if test -f "$kiwi_lavapipe_icd"; then export VK_ICD_FILENAMES="$kiwi_lavapipe_icd"; break; fi
          done
          test -n "${VK_ICD_FILENAMES:-}"
          xvfb-run -a make shader-smoke configuration-reload-smoke search-smoke vi-smoke selection-smoke hints-smoke hints-framebuffer-smoke color-glyph-smoke 2>&1 | tee .build/appearance-evidence/software-vulkan.log
          KIWI_HOST=gtk GTK_A11Y=none xvfb-run -a make color-glyph-smoke 2>&1 | tee .build/appearance-evidence/color-gtk-wgpu.log
          KIWI_HOST=gtk GTK_A11Y=none KIWI_GTK_PRESENTER=gl xvfb-run -a make color-glyph-smoke gtk-gl-area-smoke 2>&1 | tee .build/appearance-evidence/color-gtk-gl.log
          GTK_A11Y=none xvfb-run -a ./script/gtk-configuration-reload-smoke 2>&1 | tee .build/appearance-evidence/configuration-gtk-gl.log
          ./script/main-context-wake-smoke 2>&1 | tee .build/appearance-evidence/glib-atspi-readiness.log
          xvfb-run -a ./script/pty-wake-smoke 2>&1 | tee .build/appearance-evidence/readiness-glfw.log
          KIWI_HOST=gtk GTK_A11Y=none xvfb-run -a ./script/pty-wake-smoke 2>&1 | tee .build/appearance-evidence/readiness-gtk.log
          xvfb-run -a ./script/idle-wake-smoke --report .build/appearance-evidence/idle-glfw.json
          KIWI_HOST=gtk GTK_A11Y=none xvfb-run -a ./script/idle-wake-smoke --report .build/appearance-evidence/idle-gtk.json
          xvfb-run -a ./script/bench-interactive --trials 1 --samples 4 --warmup 1 --report .build/appearance-evidence/interactive-glfw.json
          KIWI_HOST=gtk GTK_A11Y=none xvfb-run -a ./script/bench-interactive --trials 1 --samples 4 --warmup 1 --report .build/appearance-evidence/interactive-gtk.json
          xvfb-run -a ./script/bench-interactive --mode saturated --traffic styled-unicode --trials 1 --samples 4 --warmup 1 --report .build/appearance-evidence/interactive-unicode-glfw.json
          KIWI_HOST=gtk GTK_A11Y=none xvfb-run -a ./script/bench-interactive --mode saturated --traffic styled-unicode --trials 1 --samples 4 --warmup 1 --report .build/appearance-evidence/interactive-unicode-gtk.json
          ./script/primary-selection-smoke 2>&1 | tee .build/appearance-evidence/primary-glfw.log
          KIWI_HOST=gtk GTK_A11Y=none ./script/primary-selection-smoke 2>&1 | tee .build/appearance-evidence/primary-gtk.log
          KIWI_HOST=gtk GTK_A11Y=none KIWI_GTK_PRESENTER=gl ./script/primary-selection-smoke 2>&1 | tee .build/appearance-evidence/primary-gtk-gl.log
          KIWI_HOST=gtk GTK_A11Y=none KIWI_GTK_PRESENTER=gl KIWI_GTK_NATIVE_TABS=1 ./script/primary-selection-smoke 2>&1 | tee .build/appearance-evidence/primary-gtk-gl-tabs.log
      - name: upload interactive application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-linux-interactive-applications
          path: |
            .build/application-evidence
            .build/ssh-application-evidence
            .build/appearance-evidence
          include-hidden-files: true
          if-no-files-found: warn

  artifact:
    name: release artifact
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake curl unzip pkg-config luajit ncurses-bin zsh fish fonts-dejavu-core fonts-noto-cjk fonts-noto-color-emoji \
            libwayland-dev libxkbcommon-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgif-dev libglib2.0-dev libglfw3-dev libfreetype-dev libharfbuzz-dev libfontconfig1-dev libpng-dev libgtk-4-dev libadwaita-1-dev libepoxy-dev
      - name: build required GLFW with X11 and Wayland
        run: |
          ./script/build-ci-glfw "$RUNNER_TEMP/kiwi-glfw"
          printf 'PKG_CONFIG_PATH=%s/lib/pkgconfig\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/kiwi-glfw" "$RUNNER_TEMP/kiwi-glfw" >> "$GITHUB_ENV"
      - name: build reproducible release-mode artifact
        run: make release-check && make release
      - name: upload artifact and checksum metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-linux-x86_64
          path: dist/**
          if-no-files-found: error
