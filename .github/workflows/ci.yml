name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Test
        run: cargo test --workspace

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Check wasm32
        run: cargo check --workspace --target wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Enforce WASM bundle budget (<500 KB gzip)
        run: scripts/check-wasm-budget.sh

  visual-diff:
    name: Visual Diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-visual-diff-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-visual-diff-cargo-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Compare static fixtures against golden outputs
        run: cargo test -p kumeyuri-core --test visual_diff

  heap-profile:
    name: Heap Profile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-heap-profile-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-heap-profile-cargo-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Profile official render corpus
        run: cargo test -p kumeyuri-core --features dhat-heap --test heap_profile -- --nocapture

      - name: Upload heap profile
        uses: actions/upload-artifact@v6.0.0
        with:
          name: kumeyuri-core-dhat-heap
          path: target/dhat/kumeyuri-core-heap.json
          if-no-files-found: error

  reference-plugins:
    name: Reference Plugin (${{ matrix.plugin }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - kumeyuri-render-pdf
          - kumeyuri-diagram-sankey
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Cache Cargo
        uses: actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            plugins/${{ matrix.plugin }}/target
          key: ${{ runner.os }}-reference-plugin-${{ matrix.plugin }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-reference-plugin-${{ matrix.plugin }}-

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Load plugin manifest
        run: node scripts/test-reference-plugins.mjs ${{ matrix.plugin }}

      - name: Render sample and diff golden output
        run: cargo test --manifest-path plugins/${{ matrix.plugin }}/Cargo.toml

  coverage-metadata:
    name: Coverage Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check snapshot-count deltas
        env:
          COVERAGE_GATE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          COVERAGE_GATE_HEAD: ${{ github.sha }}
        run: npm run test:coverage-gate

  metric-regression:
    name: Metric Regression
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check metric regressions
        env:
          PERF_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          PERF_GATE_HEAD: ${{ github.sha }}
          PERF_GATE_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run test:perf-regression

  svg-sanitizer:
    name: SVG Sanitizer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Verify sanitized SVG animations
        run: npm run test:svg-sanitizer

  web-player-perf:
    name: Web Player Perf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check first contentful render budget
        run: npm run test:web-component:perf

  dependency-policy:
    name: Dependency Policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2.0.20
        with:
          command: check advisories licenses sources
          arguments: --all-features

  release-trust:
    name: Release Trust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Check release trust metadata
        run: npm run release:trust

  unused-dependencies:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: Check unused dependencies
        run: cargo machete
