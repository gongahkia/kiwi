name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libfreetype-dev zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ffmpeg freetype glslang spirv-cross zlib

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Smoke test
        run: |
          ./build/ci/strok --version
          ./build/ci/strok --help >/dev/null
          scripts/verify_terminal_paths.sh ./build/ci/strok

  sanitize:
    name: asan-ubsan (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libfreetype-dev zlib1g-dev

      - name: Configure
        run: cmake --preset asan-ubsan

      - name: Build
        run: cmake --build --preset asan-ubsan

      - name: Test
        run: ctest --test-dir build/asan-ubsan --output-on-failure

      - name: Decode/render smoke
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=64x48:rate=5:duration=1 -pix_fmt yuv420p /tmp/strok-sanitize.mp4
          ./build/asan-ubsan/strok --width 16 --height 8 --dump-frame 1 --dump-png /tmp/strok-sanitize.png /tmp/strok-sanitize.mp4 >/tmp/strok-sanitize.probe

      - name: Shutdown path smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: scripts/verify_shutdown_paths.sh ./build/asan-ubsan/strok

  valgrind:
    name: valgrind (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg valgrind \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libfreetype-dev zlib1g-dev

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --target strok

      - name: Shutdown path leak checks
        run: |
          cat >/tmp/strok-valgrind-wrapper <<'EOF'
          #!/usr/bin/env bash
          exec valgrind --leak-check=full --show-leak-kinds=definite --errors-for-leak-kinds=definite --error-exitcode=99 \
            ./build/ci/strok "$@"
          EOF
          chmod +x /tmp/strok-valgrind-wrapper
          scripts/verify_shutdown_paths.sh /tmp/strok-valgrind-wrapper

  homebrew:
    name: homebrew formula (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install formula from source
        run: |
          brew untap local/strok >/dev/null 2>&1 || true
          brew tap-new local/strok
          cp packaging/homebrew/strok.rb "$(brew --repo local/strok)/Formula/strok.rb"
          brew install --HEAD --build-from-source local/strok/strok

      - name: Test formula
        run: |
          strok --version
          brew test local/strok/strok
