name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @wat/ingest registry:check
      - run: pnpm --filter @wat/ingest lint:sources
      - run: pnpm --filter @wat/ingest contemporaries:lint
      - run: pnpm --filter @wat/ingest contemporaries:coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test:e2e:web
      - run: pnpm test:e2e:extension

  local-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm smoke:local-demo

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:deps
      - run: pnpm audit:licenses
      - run: pnpm security:gates
      - run: pnpm test:security-gates

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libswresample-dev libfreetype-dev zlib1g-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install cmake pkg-config ffmpeg freetype glslang spirv-cross zlib

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Smoke test
        run: |
          ./build/ci/strok --version
          ./build/ci/strok --help >/dev/null
          scripts/verify_terminal_paths.sh ./build/ci/strok

  windows-msys:
    name: build (windows-latest, msys2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            cmake
            ffmpeg
            freetype
            gcc
            make
            pkgconf
            zlib

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --test-dir build/ci --output-on-failure

      - name: Smoke test
        run: |
          ./build/ci/strok --version
          ./build/ci/strok --help >/dev/null

  windows-ucrt-core:
    name: core ABI (windows-latest, ucrt64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Preserve repository line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up UCRT64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure
        run: >-
          cmake -S . -B build/windows-ucrt-core -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSTROK_BUILD_CLI=OFF
          -DSTROK_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build/windows-ucrt-core

      - name: Test
        run: ctest --test-dir build/windows-ucrt-core --output-on-failure

  sanitize:
    name: asan-ubsan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all

  ship-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: wat_ci
          POSTGRES_PASSWORD: wat
          POSTGRES_USER: wat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wat -d wat_ci" --health-interval 10s --health-timeout 5s --health-retries 10


    env:
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      DATABASE_URL: postgres://wat:wat@localhost:5432/wat_ci
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      WAT_DATABASE_URL: postgres://wat:wat@localhost:5432/wat_ci
      WAT_VALIDATE_ENV: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config ffmpeg valgrind \
            glslang-tools spirv-cross libvulkan-dev vulkan-tools mesa-vulkan-drivers \
            libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libswscale-dev libfreetype-dev zlib1g-dev

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci --target strok

      - name: Shutdown path leak checks
        run: |
          cat >/tmp/strok-valgrind-wrapper <<'EOF'
          #!/usr/bin/env bash
          exec valgrind --leak-check=full --show-leak-kinds=definite --errors-for-leak-kinds=definite --error-exitcode=99 \
            ./build/ci/strok "$@"
          EOF
          chmod +x /tmp/strok-valgrind-wrapper
          scripts/verify_shutdown_paths.sh /tmp/strok-valgrind-wrapper

  homebrew:
    name: homebrew formula (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Homebrew source checkout
        env:
          STROK_REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${STROK_REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git".insteadOf "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Install formula from source
        run: |
          brew untap local/strok >/dev/null 2>&1 || true
          brew tap-new local/strok
          cp packaging/homebrew/strok.rb "$(brew --repo local/strok)/Formula/strok.rb"
          brew install --HEAD --build-from-source local/strok/strok

      - name: Test formula
        run: |
          strok --version
          brew test local/strok/strok
