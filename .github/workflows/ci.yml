name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install --yes luajit
      - name: Install StyLua
        run: cargo install stylua --version 2.5.2 --locked
      - name: Check formatting and run headless verification
        run: make check
