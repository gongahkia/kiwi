name: Comparison

on:
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Regenerate static comparison
        run: scripts/generate-static-comparison.sh
      - name: Commit comparison output
        run: |
          if git diff --quiet -- docs/comparison/static-parity.md site/vs/index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/comparison/static-parity.md site/vs/index.html
          git commit -m "bench: refresh comparison page"
          git push
