name: Bug
description: Report incorrect behavior or a crash.
title: "bug: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal Mermaid input and exact command.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Output
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Output
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: kumeyuri --version
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS 15 arm64, Ubuntu 24.04 x86_64, etc.
