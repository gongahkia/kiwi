name: Feature
description: Propose a feature or supported workflow.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user workflow is blocked or painful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should kumeyuri do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other designs or tools considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - parser
        - layout
        - animation
        - renderer
        - CLI
        - docs
        - other
    validations:
      required: true
