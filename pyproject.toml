[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwi"
version = "0.0.0"
description = "A deterministic programmable squad tactics game."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pygame-ce>=2.5,<3"]

[project.optional-dependencies]
dev = [
  "mypy>=1.19,<2",
  "pytest>=8.4,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
kiwi = "kiwi.cli:main"
kiwi-glasshouse = "kiwi.glasshouse:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kiwi.render" = ["assets/*.json", "assets/*.ttf", "assets/*.txt"]

[tool.pytest.ini_options]
addopts = ["-ra"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["kiwi"]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
python_version = "3.12"
strict = true
warn_unreachable = true
