services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wat
      POSTGRES_PASSWORD: wat
      POSTGRES_USER: wat
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wat -d wat"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    cpus: 2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://wat:wat@postgres:5432/wat
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      WAT_RATE_LIMIT_IP: 100000
      WAT_RATE_LIMIT_TEAM: 100000
      WAT_RATE_LIMIT_USER: 100000
      WAT_RATE_LIMIT_WINDOW_MS: 60000
    ports:
      - "${WAT_WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
