<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>strok embed smoke</title>
<script type="module">
  import {
    defineStrokPlayer,
    parseCast,
    recordingToHtml,
  } from "../dist/strok-embed.js";

  defineStrokPlayer();
  const cast = [
    "{\"version\":2,\"width\":4,\"height\":2}",
    "[0,\"o\",\"A\"]",
    "[0.25,\"o\",\"B\"]",
  ].join("\n");
  document.querySelector("#helper").innerHTML = recordingToHtml(parseCast(cast), 0.25);
  window.strokSmokeReady = true;
</script>
<strok-player id="player" format="cast" cols="4" rows="2" controls>
{"version":2,"width":4,"height":2}
[0,"o","A"]
[0.25,"o","B"]
</strok-player>
<output id="helper"></output>
