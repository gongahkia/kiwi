groups:
  - name: wat.availability
    rules:
      - alert: WatReadyzDown
        expr: probe_success{job="wat-readyz"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: wat readiness probe is failing
          runbook: docs/runbook.md#db-failover

      - alert: WatHighSearchLatency
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{route="/api/v1/search"}[5m])) by (le)) > 0.5
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: wat search p95 latency is above hosted SLO
          runbook: docs/runbook.md#triage

  - name: wat.data-path
    rules:
      - alert: WatDbErrors
        expr: increase(wat_db_error_total[5m]) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: wat database errors are increasing
          runbook: docs/runbook.md#db-failover

      - alert: WatBackupStale
        expr: time() - wat_backup_last_success_timestamp_seconds > 93600
        for: 30m
        labels:
          severity: ticket
        annotations:
          summary: wat latest successful backup is older than 26 hours
          runbook: docs/production-readiness.md#backups-and-restore

      - alert: WatCorpusRefreshFailed
        expr: increase(wat_corpus_refresh_failed_total[1h]) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: wat corpus refresh failed
          runbook: docs/runbook.md#scraper-failure

  - name: wat.integrations
    rules:
      - alert: WatSlackEventFailures
        expr: sum(increase(slack_http_request_total{path="/slack/events",status!~"2.."}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Slack event delivery is failing
          runbook: docs/production-readiness.md#release-verification

      - alert: WatTeamsSearchFailures
        expr: sum(increase(teams_search_total{status!~"2.."}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Teams search requests are failing
          runbook: docs/production-readiness.md#release-verification

      - alert: WatDiscordInteractionFailures
        expr: sum(increase(discord_http_request_total{path="/interactions",status!~"2.."}[5m])) > 0
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: Discord interaction requests are failing
          runbook: docs/production-readiness.md#release-verification
