[package]
name = "kumeyuri-render-raster"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "Raster renderer for kumeyuri frames and timelines."

[lib]
path = "src/lib.rs"

[dependencies]
font8x8 = "0.3.1"
gif = "0.14.2"
kumeyuri-core = { path = "../kumeyuri-core" }
png = "0.18.1"
tiny-skia = "0.12.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webp-animation = { version = "0.10.0", features = ["static"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5.0"
kumeyuri-render-svg = { path = "../kumeyuri-render-svg" }
