[package]
name = "kumeyuri-cli"
version = "1.1.0-plugins"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
homepage = "https://github.com/gongahkia/kumeyuri"
readme = "README.md"
description = "Command-line interface for kumeyuri."

[[bin]]
name = "kumeyuri"
path = "src/main.rs"

[package.metadata.dist]
formula = "kumeyuri"

[dependencies]
axum = { version = "0.8.7", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
flate2 = "1.1.9"
fluent-bundle = "0.16.0"
kumeyuri-core = { version = "1.1.0-plugins", path = "../kumeyuri-core" }
kumeyuri-render-raster = { version = "0.0.0", path = "../kumeyuri-render-raster" }
kumeyuri-render-svg = { version = "0.0.0", path = "../kumeyuri-render-svg" }
kumeyuri-render-tui = { version = "0.0.0", path = "../kumeyuri-render-tui" }
libloading = "0.8"
rmcp = { version = "1.7.0", features = ["server", "transport-io", "transport-streamable-http-server", "schemars"] }
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52.3", features = ["rt", "macros", "net"] }
toml = "1.1.2"
unic-langid = "0.9.6"
ureq = "3.3.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
