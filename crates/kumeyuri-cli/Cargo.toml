[package]
name = "kumeyuri-cli"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "Command-line interface for kumeyuri."

[[bin]]
name = "kumeyuri"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
kumeyuri-core = { path = "../kumeyuri-core" }
