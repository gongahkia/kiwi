[package]
name = "kumeyuri-cli"
version = "0.1.0-static"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "Command-line interface for kumeyuri."

[[bin]]
name = "kumeyuri"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
kumeyuri-core = { version = "0.1.0-static", path = "../kumeyuri-core" }
kumeyuri-render-raster = { path = "../kumeyuri-render-raster" }
kumeyuri-render-svg = { path = "../kumeyuri-render-svg" }
kumeyuri-render-tui = { path = "../kumeyuri-render-tui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3.3.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = { version = "0.30.1", default-features = false, features = ["crossterm"] }
