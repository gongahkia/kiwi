[package]
name = "kumeyuri-render-wasm"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "wasm-bindgen browser renderer bindings for kumeyuri."

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
kumeyuri-core = { path = "../kumeyuri-core" }
kumeyuri-render-svg = { path = "../kumeyuri-render-svg" }
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.125"
