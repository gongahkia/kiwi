[package]
name = "mdbook-kumeyuri"
version = "0.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "mdBook preprocessor for rendering Mermaid fences with kumeyuri."

[[bin]]
name = "mdbook-kumeyuri"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = "4.6.1"
kumeyuri-core = { version = "1.1.0-plugins", path = "../kumeyuri-core" }
kumeyuri-render-svg = { version = "0.0.0", path = "../kumeyuri-render-svg" }
serde_json = "1.0.145"
