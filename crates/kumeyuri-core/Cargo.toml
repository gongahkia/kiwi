[package]
name = "kumeyuri-core"
version = "1.1.0-plugins"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "Core parser, layout, animation, and frame model for kumeyuri."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.11.0"
