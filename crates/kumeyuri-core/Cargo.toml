[package]
name = "kumeyuri-core"
version = "1.1.0-plugins"
edition = "2024"
license = "MIT"
repository = "https://github.com/gongahkia/kumeyuri"
description = "Core parser, layout, animation, and frame model for kumeyuri."

[features]
dhat-heap = ["dep:dhat"]

[lib]
path = "src/lib.rs"

[dependencies]
dhat = { version = "0.3.3", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-bidi = "0.3"
unicode-segmentation = "1.13"
unicode-width = "0.2"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "parse_layout_render"
harness = false
